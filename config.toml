baseURL = "https://www.ssp.sh/brain/"  #keep www. here, otherwise search (cmd+k) and others will not work. Website has been hard coded in `header.html`, as otherwise CORS prevented to load correctly with this url.
locale = "en-us"
googleAnalytics = ""
relativeURLs = false
disablePathToLower = true
disableAliases = true #as blanks are not handled and e.g. "OLAP Cubes" will create two aliases OLAP and Cubes and break the actual note "olap"
# ignoreFiles = [
#     "/content/templates/*",
#     "/content/private/*",
# ]
summaryLength = 20
enableGitInfo = true # produces RSS feed too at /index.xml; it uses `pubDate` from git commit dates (lastmod chain: frontmatter lastmod → :git → date)

[markup]
    [markup.tableOfContents]
        endLevel = 2
        ordered = false
        startLevel = 2
    [markup.highlight]
        noClasses = false
        anchorLineNos = false
        codeFences = true
        guessSyntax = true
        hl_Lines = ""
        lineAnchors = ""
        lineNoStart = 1
        lineNos = true
        lineNumbersInTable = true
        style = "dracula"
    [frontmatter]
        lastmod = ["lastmod", ":git", "date", "publishDate"]
        publishDate = ["publishDate", "date"]
    [markup.goldmark.renderer]
        unsafe = true
        hardWraps = true # this will handle line breaks correctly when uploading to HTML (without the need to add double space at the end of a line)
[params]
  # site default theme ("light", "dark", "auto")
  defaultTheme = "dark"
  # author name
  author = "Simon Späti"
  authorUrl = "https://www.ssp.sh"
  recentNotes = 30 #notes for SecondBrain
  # recent-updates edit history (read by utils/recent_updates.py, build-time only)
  recentUpdatesLookbackDays = 1825    # git word-diff scan window (~5y, tough first commit was ~4 years 022571b · 2022-09-28); history depth only, no viewer cost
  recentUpdatesSessionGapHours = 24   # commits closer than this fold into one editing session
  recentUpdatesMaxSessions = 200        # sessions shown in a note's change popover

# ---------------------------------------------------------------------------
# LOCAL ADDITION (not from upstream Quartz) — raw Markdown output per note.
# `make sync-upstream` checks out config.toml from upstream/hugo, which would
# drop this block. Re-add it after any upstream sync.
#
# Publishes every note a second time as plain Markdown at
# /brain/<slug>/index.md, rendered by layouts/_default/single.md (.RawContent,
# so wikilinks and callouts stay in their Obsidian source form).
# Mirrors the same setup in ../sspaeti-hugo-blog/config.toml.
#
# Only the `page` kind is overridden. home/section/taxonomy/term keep Hugo's
# defaults, so the RSS feed at /brain/index.xml and all HTML output are
# untouched.
# ---------------------------------------------------------------------------
[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["md"]

[outputFormats.MarkDown]
  mediaType = "text/plain"
  isPlainText = true
  isHTML = false

[outputs]
  page = ["HTML", "MarkDown"]
