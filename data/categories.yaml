# Note categories, curated by the author. Order = importance: it drives the
# /brain/categories/ index, the dashboard sort and the tie-break when a note
# links equally into two categories. `hubs` are note filename stems as in
# content/ (lowercase, spaces kept); the first hub is the category's entry
# note and all hubs are shown as "Start with". `group` only rolls categories
# up on the index page and in the dashboard. `blog_categories` maps the blog's
# Hugo categories onto these for the stats dashboard.
#
# Regenerate a proposal with `obsidian-quartz note-category --propose`
# (note_category_proposal.md); the build report is note_category_report.md.
# Spec: docs/superpowers/specs/2026-11-06-note-categories-design.md
